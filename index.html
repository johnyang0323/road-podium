<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="카트에서 시작해 F1 월드 챔피언을 노리는 드라이버 커리어 시뮬레이션 게임 (비공식 팬메이드)">
<meta property="og:title" content="포디움 로드">
<meta property="og:description" content="카트에서 월드 챔피언까지. 무료 웹 드라이버 커리어 게임">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>포디움 로드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one narrow column, one job per screen. Three tabs (레이스 / 순위 / 드라이버) on a bottom bar; grouped lists and large titles. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --raise:#e9e9ee; --ink:#1c1c1e; --muted:#6e6e73; --line:#dcdce1;
  --blue:#0071e3; --on-blue:#ffffff; --green:#1f8a3b; --red:#d70015; --purple:#8944ab; --bar:rgba(249,249,251,.84);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --raise:#2c2c2e; --ink:#f5f5f7; --muted:#98989f; --line:#38383a;
  --blue:#0a84ff; --on-blue:#ffffff; --green:#30d158; --red:#ff453a; --purple:#bf5af2; --bar:rgba(22,22,24,.84); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --raise:#2c2c2e; --ink:#f5f5f7; --muted:#98989f; --line:#38383a;
  --blue:#0a84ff; --on-blue:#ffffff; --green:#30d158; --red:#ff453a; --purple:#bf5af2; --bar:rgba(22,22,24,.84); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,p{margin:0}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hd{padding:14px 4px 2px}
.lt{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:15px}
.cap{color:var(--muted);font-size:13px;font-weight:600}
.ttl{font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
.gl{color:var(--muted);font-size:13px;font-weight:600;padding:8px 16px 0}
.hint{color:var(--muted);font-size:13px;padding:0 16px}
.card{background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.between{display:flex;flex-direction:row;justify-content:space-between;align-items:center;gap:12px}
.note{background:var(--raise);border-radius:12px;padding:10px 12px;font-size:14px}
.purple{color:var(--purple)} .green{color:var(--green)} .red{color:var(--red)} .mut{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--blue);color:var(--on-blue);font-weight:600;font-size:17px;padding:14px;cursor:pointer}
.btn:active{opacity:.8}
.tbtn{background:none;border:0;color:var(--blue);font-size:16px;padding:8px;cursor:pointer;align-self:center}
.tbtn.red{color:var(--red)}
.pill{border:0;border-radius:999px;background:var(--raise);color:var(--blue);font-weight:600;font-size:15px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.pill:disabled{color:var(--muted);cursor:default}

/* grouped list */
.list{background:var(--surface);border-radius:18px;overflow:hidden}
.rw{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;background:none;border:0;border-top:1px solid var(--line);text-align:left;min-width:0}
.rw:first-child{border-top:0}
button.rw{cursor:pointer} button.rw:active{background:var(--raise)}
.rw .g{flex:1;min-width:0;display:flex;flex-direction:column}
.rw .g b{font-weight:600;overflow-wrap:anywhere} .rw .g span{color:var(--muted);font-size:13px}
.rw .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rw .v small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.rw .p{width:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.rw .ch{color:var(--muted);font-size:20px;flex:none} .rw .ck{color:var(--blue);font-weight:700;flex:none;width:18px}
.rw.me{background:var(--raise)} .rw.me .p{color:var(--ink)}
.sw{width:4px;height:30px;border-radius:2px;flex:none;background:var(--line)}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.form input,.form select{font:inherit;font-size:17px;color:var(--ink);background:var(--raise);border:0;border-radius:10px;padding:10px 12px;width:100%}

/* pieces */
.strip{border:0;text-align:left;cursor:pointer;flex-direction:row;justify-content:space-between;align-items:center;padding:14px 18px}
.strip .g{display:flex;flex-direction:column;min-width:0} .strip b{font-size:17px;overflow-wrap:anywhere}
.ovr{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.ovr small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.ovr.xl{font-size:64px}
.prog{height:6px;border-radius:3px;background:var(--raise);overflow:hidden} .prog i{display:block;height:100%;background:var(--blue);border-radius:3px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.chipb{border:0;border-radius:12px;background:var(--raise);padding:10px 8px;font-size:15px;font-weight:600;cursor:pointer}
.chipb.on{background:var(--blue);color:var(--on-blue)}
.tags{display:flex;gap:6px;flex-wrap:wrap} .tag{background:var(--raise);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.resrow{display:flex;gap:16px;align-items:center} .resrow>div:last-child{min-width:0}
.pos{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1;flex:none}
.stat{display:grid;grid-template-columns:86px 1fr 30px 40px;gap:10px;align-items:center;font-size:15px}
.stat .bar{height:6px;border-radius:3px;background:var(--raise);overflow:hidden} .stat .bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.stat .d{font-size:12px;color:var(--green);text-align:right;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.tiles b{display:block;font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums} .tiles span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--raise);border-radius:10px;padding:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.foot{font-size:12px;color:var(--muted);padding:8px 16px;text-align:center}

.screen{background:#111111;border-radius:18px;padding:8px}
.screen canvas{display:block;width:100%;aspect-ratio:180/112;image-rendering:pixelated;border-radius:10px}
.hudw{display:flex;flex-direction:column;gap:14px}
.tyre{display:grid;grid-template-columns:auto 1fr 38px;gap:10px;align-items:center} .tyre .cap:last-child{text-align:right}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center} .ctrl .pill{flex:1 1 140px;padding:11px 14px}
.px{image-rendering:pixelated;flex:none}
.wz{display:flex;align-items:center;gap:12px;padding:6px 4px 0} .wz .prog{flex:1}
.back{border:0;background:none;font-size:34px;line-height:.8;color:var(--blue);cursor:pointer;padding:0 8px 6px 0}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hb{border:2px solid transparent;border-radius:14px;background:var(--raise);padding:14px 0;display:flex;justify-content:center;cursor:pointer}
.hb.on{border-color:var(--blue);background:var(--surface)}
.cand{border:2px solid transparent;text-align:left;cursor:pointer;width:100%} .cand.on{border-color:var(--blue)}
.ladder{display:flex;align-items:center;gap:6px;width:100%;max-width:340px}
.ladder span{font-size:12px;font-weight:700;color:var(--muted);background:var(--raise);border-radius:999px;padding:3px 9px}
.ladder span.on{background:var(--blue);color:var(--on-blue)} .ladder i{flex:1;height:2px;background:var(--line)}
.btn:disabled{opacity:.4;cursor:default} .tbtn:disabled{color:var(--muted);cursor:default}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.tabbar div{max-width:540px;margin:0 auto;display:flex}
.tabbar button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;padding:4px;cursor:pointer;border-radius:10px}
.tabbar button.on{color:var(--blue)}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){.flash{animation:fl .3s ease-out}}
@keyframes fl{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
</style>
</head>
<body>

<div id="app"></div>

<script>
'use strict';
/* ---------- data ---------- */
const TIERS=[
 {name:'카트 선수권',short:'KART',rounds:6,base:36,cw:.25},
 {name:'포뮬러 4',short:'F4',rounds:7,base:47,cw:.3},
 {name:'포뮬러 3',short:'F3',rounds:8,base:57,cw:.35},
 {name:'포뮬러 2',short:'F2',rounds:10,base:66,cw:.35},
 {name:'F1 월드 챔피언십',short:'F1',rounds:16,cw:.55}];
const GP=4;
const TEAMS=[['메르세데스','#27c8b4',94],['페라리','#e0282d',91],['맥라렌','#f58020',90],['레드불 레이싱','#3b63c9',87],['하스','#9aa0a8',80],
 ['알핀','#e868b3',79],['레이싱 불스','#6c8cff',79],['아우디','#b8443a',77],['윌리엄스','#2a9be8',77],['애스턴 마틴','#1f8a6d',72],['캐딜락','#8a8f99',70]];
// 2026 시즌 그리드: [이름, 팀, OVR, 나이, 잠재력]
const DRIVERS=[['조지 러셀',0,91,28],['키미 안토넬리',0,85,19,95],['샤를 르클레르',1,91,28],['루이스 해밀턴',1,87,41],['랜도 노리스',2,91,26],['오스카 피아스트리',2,90,25,93],
 ['막스 베르스타펜',3,95,28],['아이작 아자르',3,84,21,91],['에스테반 오콘',4,82,29],['올리버 베어먼',4,82,21,90],['피에르 가슬리',5,85,30],['프랑코 콜라핀토',5,78,23,85],
 ['리암 로슨',6,80,24,85],['아비드 린드블라드',6,77,18,91],['니코 휠켄베르크',7,83,38],['가브리엘 보르톨레토',7,81,21,90],['알렉스 알본',8,85,30],['카를로스 사인츠',8,87,31],
 ['페르난도 알론소',9,87,44],['랜스 스트롤',9,78,27],['세르히오 페레스',10,81,36],['발테리 보타스',10,80,36]];
const PROSPECTS='레오나르도 포르나롤리|알렉스 던|리처드 베르쇼어|페페 마르티|루크 브라우닝|잭 두한|조슈아 뒤르크센|디노 베가노비치|라파엘 카마라|니콜라 촐로프|프레디 슬레이터|올리버 괴테|폴 아론|잭 크로포드|빅토르 마르틴스|세바스티안 몬토야|쿠시 마이니|츠노다 유키|저우관위|믹 슈마허|펠리페 드루고비치|테오 푸르셰르|이와사 아유무|미야타 리토모|로만 스타넥|마리 보야|노엘 레온|우고 우고추쿠|투카 타포넨|라우렌스 판 후펜|마르티니우스 스텐스호르네|팀 트람니츠|알레산드로 지우스티|가브리엘레 미니|막스 에스터슨|크리스티안 호|테오필 나엘|제임스 워튼|브랜도 바도어|도리안 핀|신우현|키안 나카무라-베르타|엔조 델리니|찰리 워츠|산티아고 라모스|칼럼 부아쟁|닉 더프리스|로버트 슈워츠먼|콜턴 허타|파토 오와드'.split('|');
const JR_TEAMS=['프레마 레이싱','ART 그랑프리','하이텍','캄포스 레이싱','로딘 모터스포트','MP 모터스포트','인빅타 레이싱','DAMS','트라이던트','반 아메르스포르트'];
const CIRCUITS=['사키르','제다','멜버른','스즈카','상하이','마이애미','이몰라','모나코','바르셀로나','몬트리올','실버스톤','스파','몬차','싱가포르','상파울루','아부다비'];
const FIRST='루카 마테오 올리버 펠릭스 휴고 다니엘 안톤 켄지 리암 노아 에밀 라파엘 니코 테오 유리 하루토 지안 마르코 알렉스 빅토르 토마스 이안 준호 카이 디에고 엔조 요나스 패트릭 사미르 민재'.split(' ');
const LAST='베르나르디 하트만 린드크비스트 모로 오카다 산토스 뮐러 페트로프 캠벨 드보어 로시니 타카하시 앤더슨 가르시아 쿠퍼 뒤랑 노박 실바 반더베르크 맥캘런 요한손 페레이라 윤 강 첸 싱 코왈스키 브레너 마르티넬리 피셔'.split(' ');
const STATS=[['pace','예선 속도'],['race','레이스 운영'],['ovt','추월'],['tyre','타이어 관리'],['wet','빗길'],['mental','멘탈']];
const STYLES=[['pace','폴 헌터','한 바퀴 속도가 타고났다. 예선 속도 +7'],['race','레이스 장인','긴 스틴트에서 강하다. 레이스 운영 +7'],['ovt','브레이킹 귀신','늦은 브레이킹으로 파고든다. 추월 +7'],['wet','레인 마스터','젖은 노면에서 살아난다. 빗길 +7']];
const NATIONS=['대한민국','일본','영국','독일','이탈리아','프랑스','스페인','네덜란드','브라질','호주','미국','핀란드'];
const PTS=[25,18,15,12,10,8,6,4,2,1];
const SAVE='podiumroad_save_v1', HALL='podiumroad_hall_v1';

/* ---------- helpers ---------- */
const R=Math.random, ri=(a,b)=>a+Math.floor(R()*(b-a+1)), pick=a=>a[Math.floor(R()*a.length)];
const g=()=>(R()+R()+R()-1.5)*2;             // ~N(0,1)
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rname=()=>pick(FIRST)+' '+pick(LAST);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let G=null, draft=null, confirmRetire=false, confirmNew=false, tab='race', seg='champ';

const ovrOf=s=>s.pace*.25+s.race*.25+s.ovt*.15+s.tyre*.15+s.wet*.1+s.mental*.1;
const grade=p=>p>=94?'S':p>=88?'A':p>=82?'B':p>=76?'C':'D';
const rollPot=()=>Math.round(72+Math.pow(R(),1.25)*26);

/* ---------- world ---------- */
function freeProspects(){const on=new Set(G.drivers.map(d=>d.name));return PROSPECTS.filter(n=>!on.has(n)&&!G.used.includes(n))}
function prospect(){const f=freeProspects();const n=f.length?pick(f):rname();G.used.push(n);return n}
function mkDriver(ovr,age,team,pot){return{id:G.nid++,name:prospect(),ovr,age,team,pot:pot||clamp(ovr+R()*7,ovr,97)}}
function newWorld(){
  G.teams=TEAMS.map(t=>({name:t[0],color:t[1],car:t[2]}));G.used=[];
  G.drivers=DRIVERS.map(d=>({id:G.nid++,name:d[0],team:d[1],ovr:d[2],age:d[3],pot:d[4]||d[2]}));
}
const teamDrivers=t=>G.drivers.filter(d=>d.team===t).sort((a,b)=>b.ovr-a.ovr);
function evolveWorld(){
  G.regIn=(G.regIn||4)-1; const reg=G.regIn<=0; if(reg)G.regIn=4;
  G.teams.forEach(t=>{t.car=reg?t.car*.5+(62+R()*33)*.5:t.car+g()*2.5+(79-t.car)*.1; t.car=clamp(t.car,60,96)});
  G.regNews=reg;
  G.drivers.forEach((d,i)=>{
    d.age++;
    if(d.age<=26)d.ovr+=Math.min(d.pot-d.ovr,R()*2.5); else if(d.age>=33)d.ovr-=.5+R()*1.5;
    if(d.age>=41?R()<.6:d.age>=37?R()<.25:(d.ovr<73&&R()<.5)){const n=mkDriver(72+R()*8,ri(19,23),d.team,78+R()*18);G.drivers[i]=n}
  });
  // top teams poach the best driver from further down the grid
  const order=G.teams.map((t,i)=>i).sort((a,b)=>G.teams[b].car-G.teams[a].car);
  order.slice(0,4).forEach(ti=>{
    if(R()>.35)return; const mine=teamDrivers(ti); if(mine.length<2)return; const weak=mine[mine.length-1];
    const lower=G.drivers.filter(d=>G.teams[d.team].car<G.teams[ti].car-3).sort((a,b)=>b.ovr-a.ovr)[0];
    if(lower&&lower.ovr>weak.ovr+3){const t=lower.team;lower.team=ti;weak.team=t}
  });
}

/* ---------- career ---------- */
function startCareer(){
  const cd=draft.cands[draft.sel], s={...cd.stats};

function chooseLive(i){const ev=RC.ev; if(!ev)return; RC.msg=ev.o[i].f(); RC.ev=null; RC.paused=false; RC.started=true; stepLap(); if(RC.me.out){fastFinish(true);return} hud()}

function lapEnd(){
  RC.lap++; RC.t=0; RC.c.E.forEach(e=>e.P0=e.P);
  if(RC.me.out){fastFinish(false);return}

  if(RC.cps.includes(RC.lap)){const ev=liveEvent(); if(ev){RC.ev=ev;RC.paused=true;hud();return}}

}

  if(RC){drawRace();requestAnimationFrame(tick)}}
function finishLive(){const c=RC.c; c.E.forEach(e=>{e.dnf=!!e.out;e.rs=e.out?-999+e.outLap:e.P}); RC=null; finishRace(c,null)}

  const prog=RC.started?RC.lap+t:0, blink=(performance.now()/250|0)%2;
  const car=e=>{ if(e.out)return; let f=(prog+(e.dp-mx)*.02)%1; if(f<0)f+=1; const p=P[(f*N)|0], x=p[0]|0, y=p[1]|0;
    if(e.me){c.fillStyle=blink?'#ffe14a':'#111111';c.fillRect(x-3,y-3,7,7);c.fillStyle='#ffffff';c.fillRect(x-2,y-2,5,5)}else{c.fillStyle='#111111';c.fillRect(x-2,y-2,5,5)}
    c.fillStyle=e.col;c.fillRect(x-1,y-1,3,3)};
  RC.c.E.forEach(e=>{if(!e.me)car(e)}); car(RC.me);
  if(RC.c.wet||(RC.rained&&!RC.c.wet&&RC.used.rain)){c.fillStyle='#a9d4ff';for(let i=0;i<36;i++)c.fillRect(R()*180|0,R()*112|0,1,2)}
}

function standings(){return Object.entries(G.table).map(([k,v])=>({key:k,...v})).sort((a,b)=>b.pts-a.pts||b.wins-a.wins)}
function endSeason(){
  const st=standings(), idx=st.findIndex(r=>r.key==='P'), pos=idx<0?null:idx+1, champ=pos===1;
  if(champ){if(G.tier===GP)G.tot.titles++;else G.tot.jr++}
  let mate=null;
  if(G.tier===GP&&G.role==='race'){const m=teamDrivers(G.team)[0];if(m){const r=G.table['d'+m.id];mate={name:m.name,pts:r?r.pts:0}}}
  G.history.push({year:G.year,age:G.age,series:TIERS[G.tier].short,team:teamName(),role:G.role,pos,pts:idx<0?0:st[idx].pts,wins:G.ss.wins,pod:G.ss.podiums,champ});
  G.seasonEnd={pos,champ,pts:idx<0?0:st[idx].pts,mate,winner:st[0]&&st[0].name};
  G.offers=makeOffers(pos,mate);G.phase='offseason';confirmRetire=false;
}
function makeOffers(pos,mate){
  const o=[], ovr=ovrOf(G.stats), age=G.age+1;
  const gpOffers=(rep)=>{const res=[];
    G.teams.forEach((t,i)=>{const td=teamDrivers(i); if(!td.length)return; const weak=td[td.length-1];
      const mine=G.tier===GP&&G.team===i; if(mine&&G.role==='race')return;
      const sc=ovr+(age<=23?3:0)+rep+g()*2;
      if(sc>=weak.ovr)res.push({type:'gp',team:i,role:'race'});
      else if((sc>=weak.ovr-9&&age<=27)||mine)res.push({type:'gp',team:i,role:'reserve'})});
    const race=res.filter(r=>r.role==='race').sort((a,b)=>G.teams[b.team].car-G.teams[a.team].car).slice(0,3);
    const rsv=res.filter(r=>r.role==='reserve').sort((a,b)=>G.teams[b.team].car-G.teams[a.team].car).slice(0,2);
    return race.concat(rsv)};
  if(G.tier<GP){
    if(age>26){return o}                         // funding runs out
    const nt=G.tier+1;
    if(nt<GP){
      if(pos===1){o.push({type:'jr',tier:nt,name:pick(JR_TEAMS),bonus:3},{type:'jr',tier:nt,name:pick(JR_TEAMS),bonus:0})}
      else if(pos<=3){o.push({type:'jr',tier:nt,name:pick(JR_TEAMS),bonus:0},{type:'jr',tier:nt,name:pick(JR_TEAMS),bonus:-3})}
      else if(pos<=6&&ovr>=TIERS[nt].base-7)o.push({type:'jr',tier:nt,name:pick(JR_TEAMS),bonus:-3});
    }else if(pos<=5){gpOffers(pos===1?4:pos<=3?2:0).forEach(x=>o.push(x))}
    o.push({type:'jr',tier:G.tier,name:pos<=5?pick(JR_TEAMS):G.jr.name,bonus:pos<=5?2:G.jr.bonus,stay:1});
  }else{
    let rep=0, dropped=false;
    if(G.role==='race'){rep=pos===1?4:pos<=3?3:pos<=8?1:0;
      const rank=G.teams.map((t,i)=>i).sort((a,b)=>G.teams[b].car-G.teams[a].car).indexOf(G.team);
      if(mate&&G.seasonEnd.pts<mate.pts*.45&&rank<6&&R()<.65)dropped=true;
      if(age>=37&&ovr<82)dropped=true;
      if(!dropped)o.push({type:'gp',team:G.team,role:'race',stay:1});
      G.seasonEnd.dropped=dropped}
    gpOffers(rep).forEach(x=>o.push(x));
    if(!o.some(x=>x.role==='race')&&age<=26)o.push({type:'jr',tier:3,name:pick(JR_TEAMS),bonus:3,back:1});
  }
  return o;
}
function acceptOffer(i){
  const of=G.offers[i];
  // vacate current GP race seat
  if(G.tier===GP&&G.role==='race'&&!(of.type==='gp'&&of.stay)){G.drivers.push(mkDriver(73+R()*8,ri(20,27),G.team))}
  evolveWorld();
  G.age++;G.year++;
  if(G.age>=33){const k=(G.age-32)*.55;STATS.forEach(([s])=>{G.stats[s]=Math.max(20,G.stats[s]-k*(.5+R()))})}
  if(of.type==='jr'){G.tier=of.tier;G.jr={name:of.name,bonus:of.bonus};G.team=null;G.role='race'}
  else{
    if(!of.stay&&of.role==='race'){const td=teamDrivers(of.team),weak=td[td.length-1];if(td.length>=2)G.drivers=G.drivers.filter(d=>d.id!==weak.id)}
    G.tier=GP;G.team=of.team;G.role=of.role;

}

const carRank=i=>G.teams.slice().sort((a,b)=>b.car-a.car).indexOf(G.teams[i])+1;
function hallPanel(at){const hall=store.get(HALL)||[]; if(!hall.length)return '';
  return `<div class="gl">명예의 전당 (이 기기)</div><div class="list">${hall.map((h,i)=>`<div class="rw${i===at?' me':''}"><span class="p">${i+1}</span><div class="g"><b>${esc(h.name)}</b><span>${esc(h.nat)} · ${h.races}경기</span></div><span class="v">챔피언 ${h.titles}<small>${h.wins}승</small></span></div>`).join('')}</div>`}
const HELMS=[['#e0282d','#ffffff'],['#0071e3','#ffe14a'],['#ffffff','#e0282d'],['#ffd21f','#16161a'],['#2b2b33','#27c8b4'],['#f58020','#0b2a5b'],['#27c8b4','#16161a'],['#e868b3','#ffffff'],['#1f8a3b','#ffd21f'],['#8944ab','#ffffff'],['#0b2a5b','#e0282d'],['#c9ccd4','#0071e3']];
const HMAP=['....kkkkkkk.....','..kkaaaaaaakk...','.kaaaabbaaaaak..','.kaaaabbaaaaaak.','kaaaaabbaaaaaak.','kaaaaabbkkkkkkk.','kaaaaabkvvvvwvk.','kaaaaabkvvvvvvk.','kaaaaabbkkkkkkk.','kaaaaabbaaaaaak.','kaaaaabbaaaaak..','.kaaaabbaaaakk..','.kkaaabbaaakk...','...kkkkkkkkk....'];
const hcache={};
function helm(i){ if(hcache[i])return hcache[i]; const c=document.createElement('canvas');c.width=16;c.height=14;const x=c.getContext('2d'),col={k:'#16161a',a:HELMS[i][0],b:HELMS[i][1],v:'#3b4a66',w:'#cfe3ff'};
  HMAP.forEach((r,y)=>[...r].forEach((ch,xx)=>{if(col[ch]){x.fillStyle=col[ch];x.fillRect(xx,y,1,1)}})); return hcache[i]=c.toDataURL()}
const himg=(i,sz)=>`<img class="px" src="${helm(i%HELMS.length)}" width="${sz}" height="${Math.round(sz*14/16)}" alt="">`;
const KNAMES=['한서준','김도윤','이하준','박시우','정우진','최건우','강민혁','윤태오','서지호','문현우'];
function mkCands(){const keys=STATS.map(x=>x[0]);
  return STYLES.slice().sort(()=>R()-.5).slice(0,3).map(st=>{const v={};keys.forEach(k=>v[k]=29+ri(0,11));v[st[0]]+=8;
    let d=222-keys.reduce((a,k)=>a+v[k],0);while(d!==0){const k=pick(keys);if(d>0&&v[k]<50){v[k]++;d--}else if(d<0&&v[k]>26&&k!==st[0]){v[k]--;d++}}
    return {style:st[0],name:st[1],desc:st[2].split('. ')[0]+'.',stats:v,pot:rollPot()}})}
const wz=n=>`<div class="wz"><button class="back" data-a="cback" aria-label="뒤로">‹</button><div class="prog"><i style="width:${n*25}%"></i></div><span class="cap num">${n} / 4</span></div>`;
const lead=(t,sub)=>`<header class="hd" style="padding-top:4px"><h1 class="ttl" style="font-size:28px">${t}</h1><p class="sub">${sub}</p></header>`;
function viewCreate(){const d=draft;
  if(d.step===0)return head('포디움 로드','열다섯 살, 카트 한 대에서 시작합니다.')+
    `<div class="card" style="align-items:center;text-align:center;padding-block:28px">${himg(d.helmet,112)}<p style="max-width:30ch">레이스마다 내리는 선택이 쌓여 커리어가 됩니다. F1 시트, 그리고 월드 챔피언까지.</p>
     <div class="ladder">${['카트','F4','F3','F2','F1'].map((l,i)=>`<span class="${i?'':'on'}">${l}</span>`).join('<i></i>')}</div></div>`+hallPanel()+
    `<button class="btn" data-a="cnext">새 커리어 시작</button>`+FOOT;
  if(d.step===1)return wz(1)+lead('헬멧을 골라 주세요','커리어 내내 당신을 알아보게 해 줄 디자인입니다.')+
    `<div class="card"><div class="between" style="justify-content:flex-start">${himg(d.helmet,80)}<b>내 헬멧</b></div>
     <div class="hgrid">${HELMS.map((h,i)=>`<button class="hb${d.helmet===i?' on':''}" data-a="helm" data-v="${i}" aria-label="헬멧 ${i+1}">${himg(i,44)}</button>`).join('')}</div></div>
    <button class="btn" data-a="cnext">이 헬멧으로</button>`;
  if(d.step===2)return wz(2)+lead('어떤 드라이버인가요?','이름과 번호는 커리어 내내 따라다닙니다.')+
    `<div class="card form"><label for="in-name">이름<input type="text" id="in-name" maxlength="16" placeholder="드라이버 이름" value="${esc(d.name)}"></label>
     <div class="between" style="align-items:flex-end"><label for="in-num" style="flex:0 0 96px">레이스 번호<input type="number" id="in-num" min="2" max="99" inputmode="numeric" value="${d.num}"></label>
     <label for="in-nat" style="flex:1">국적<select id="in-nat">${NATIONS.map(n=>`<option${n===d.nat?' selected':''}>${n}</option>`).join('')}</select></label></div></div>
    <button class="tbtn" data-a="rand">랜덤으로 채우기</button>
    <button class="btn" id="next-btn" data-a="cnext"${d.name.trim()?'':' disabled'}>다음</button>`;
  if(d.step===3)return wz(3)+lead('드라이빙 스타일을 골라 주세요','세 후보는 능력치 합이 같고, 분포와 잠재력이 다릅니다.')+
    d.cands.map((c,i)=>{const top=STATS.slice().sort((a,b)=>c.stats[b[0]]-c.stats[a[0]]).slice(0,2);
      return `<button class="card cand${d.sel===i?' on':''}" data-a="cand" data-v="${i}"><div class="between"><div><b style="font-size:18px">${c.name}</b><div class="sub">${c.desc}</div></div><span class="ck">${d.sel===i?'✓':''}</span></div>
      <div class="tags">${top.map(t=>`<span class="tag">${t[1]} ${c.stats[t[0]]}</span>`).join('')}<span class="tag">잠재력 ${grade(c.pot)}</span></div>
      ${d.sel===i?STATS.map(([k,l])=>`<div class="stat" style="grid-template-columns:86px 1fr 30px"><span>${l}</span><div class="bar"><i style="width:${c.stats[k]}%;background:var(--blue)"></i></div><b class="num">${c.stats[k]}</b></div>`).join(''):''}</button>`}).join('')+
    `<button class="tbtn" data-a="recand"${d.rolls<=0?' disabled':''}>다른 후보 보기 (${d.rolls}회 남음)</button><button class="btn" data-a="cnext">이 스타일로</button>`;
  const c=d.cands[d.sel];
  return wz(4)+lead('집중해서 키울 능력치','최대 2개. 고른 능력치가 더 빨리 자라고, 프리시즌마다 바꿀 수 있습니다.')+
    `<div class="list">${STATS.map(([k,l])=>`<button class="rw" data-a="fstat" data-v="${k}"><div class="g"><b>${l}</b></div><span class="v mut">${c.stats[k]}</span><span class="ck">${d.focus.includes(k)?'✓':''}</span></button>`).join('')}</div>
    <button class="btn" data-a="start"${d.focus.length?'':' disabled'}>커리어 시작</button>`;
}

function phaseBlocks(){
  const T=TIERS[G.tier];
  if(G.phase==='preseason'){
    return `<div class="card"><div><div class="cap">프리시즌</div><div class="ttl">집중해서 키울 능력치</div></div>
    ${G.regNews&&G.tier===GP?'<div class="note">기술 규정이 바뀌어 팀 간 머신 서열이 크게 흔들립니다.</div>':''}
    ${G.tier===GP&&G.role==='reserve'?'<div class="note">리저브는 주전이 결장할 때만 출전하고 성장도 느립니다. 시즌 중반에 주전보다 기량이 앞서면 시트를 넘겨받습니다.</div>':''}
    <div class="chips">${STATS.map(([k,l])=>`<button class="chipb${G.focus.includes(k)?' on':''}" data-a="focus" data-v="${k}">${l}</button>`).join('')}</div><p class="sub" style="font-size:13px">최대 2개. 고르지 않으면 고르게 성장합니다.</p>
    <button class="btn" data-a="go">개막전으로</button></div>`}
  if(G.phase==='season'){
    return `<div class="card"><div><div class="cap">ROUND ${G.round+1} / ${T.rounds}</div><div class="ttl">${CIRCUITS[G.round]} 그랑프리</div></div>
    <div class="prog"><i style="width:${G.round/T.rounds*100}%"></i></div>
    ${G.promoNote?`<div class="note">${esc(G.promoNote)}</div>`:''}
    <button class="btn" data-a="next">레이스 시작</button><div class="ctrl"><button class="tbtn" data-a="quick">이 레이스 건너뛰기</button><button class="tbtn" data-a="auto">시즌 끝까지 진행</button></div></div>`}
  if(G.phase==='event'){const ev=EVENTS[G.event.e];
    return `<div class="card flash"><div><div class="cap">${CIRCUITS[G.round]} · 결정의 순간</div><div class="ttl">${ev.t}</div></div><p>${ev.d}</p></div>
    <div class="list">${ev.o.map((o,i)=>`<button class="rw" data-a="ev" data-v="${i}"><div class="g"><b>${o.l}</b><span>${o.s}${o.k?` (${STATS.find(s=>s[0]===o.k)[1]} ${Math.floor(G.stats[o.k])})`:''}</span></div><span class="ch">›</span></button>`).join('')}</div>`}
  if(G.phase==='offseason'){const e=G.seasonEnd;
    const hd=e.champ?(G.tier===GP?'월드 챔피언':T.short+' 챔피언'):e.pos?`시즌 ${e.pos}위`:'출전 없이 시즌 종료';
    const offers=G.offers.map((o,i)=>{
      if(o.type==='jr'){const t=TIERS[o.tier];return `<button class="rw" data-a="offer" data-v="${i}">${sw()}<div class="g"><b>${esc(o.name)}</b><span>${t.short} ${o.stay?'잔류':o.back?'복귀':'승격'} · ${o.bonus>0?'명문 팀':o.bonus<0?'약체 팀':'중위권 팀'}</span></div><span class="ch">›</span></button>`}
      const t=G.teams[o.team];
      return `<button class="rw" data-a="offer" data-v="${i}">${sw(t.color)}<div class="g"><b>${esc(t.name)}</b><span>${o.stay?'재계약 · ':''}${o.role==='race'?'레이스 시트':'리저브'} · 머신 ${carRank(o.team)}위</span></div><span class="ch">›</span></button>`}).join('');
    return `<div class="card flash"><div><div class="cap">${G.year} 시즌 종료</div><div class="ttl${e.champ?' purple':''}">${hd}</div></div>
    <p class="sub num">${e.pts} PTS · ${G.ss.wins}승 · 포디움 ${G.ss.podiums}회${e.champ?'':` · 챔피언 ${esc(e.winner||'-')}`}</p>
    ${e.dropped?'<div class="note">팀이 재계약을 포기했습니다. 팀메이트와의 격차가 너무 컸습니다.</div>':''}
    ${G.offers.length?'':`<div class="note">${G.tier<GP?'후원사가 떠났습니다. 주니어 포뮬러에 남을 자금이 없습니다.':'어느 팀도 시트를 제안하지 않았습니다.'}</div>`}</div>
    ${G.offers.length?`<div class="gl">${G.year+1} 시즌 제안</div><div class="list">${offers}</div>`:''}
    ${confirmRetire?`<div class="card"><p>정말 은퇴할까요? 되돌릴 수 없습니다.</p><button class="btn" data-a="retireno">계속 달린다</button><button class="tbtn red" data-a="retireyes">은퇴한다</button></div>`:`<button class="tbtn red" data-a="retire">은퇴하기</button>`}`}
  if(G.phase==='retired'){const [t,d]=legacy();
    return `<div class="card"><div><div class="cap">${G.history.length}시즌 · ${G.age}세 은퇴</div><div class="ttl">${t}</div></div><p class="sub">${d}</p>
    <div class="tiles"><div><b class="purple">${G.tot.titles}</b><span>챔피언</span></div><div><b>${G.tot.wins}</b><span>우승</span></div><div><b>${G.tot.podiums}</b><span>포디움</span></div><div><b>${G.tot.races}</b><span>출전</span></div></div>
    <button class="btn" data-a="newyes">새 커리어 시작</button></div>`+hallPanel(G.hallAt)}
  return '';
}
function lastCard(){const L=G.last; if(!L||(G.phase!=='season'&&G.phase!=='offseason'))return '';
  const c=L.dnf?'red':L.pos===1?'purple':L.pos<=3?'green':'';
  return `<div class="card flash"><div class="cap">${L.gp} 그랑프리 결과${L.wet?' · 우천':''}</div>
  <div class="resrow"><div class="pos ${L.raced?c:'mut'}">${L.raced?(L.dnf?'DNF':'P'+L.pos):'대기'}</div><div><p>${esc(L.text)}</p>${L.raced?`<p class="sub num">그리드 P${L.grid}${L.dnf?'':` · +${L.pts} PTS`}</p>`:''}</div></div>
  ${L.ev?`<div class="note">${esc(L.ev)}</div>`:''}</div>`}
function raceTab(){const T=TIERS[G.tier];
  return head(`${G.year} 시즌`,`${T.name} · ${esc(teamName())}${G.tier===GP&&G.role==='reserve'?' · 리저브':''}`)+
  `<button class="card strip" data-a="tab" data-v="me">${himg(G.helmet||0,40)}<div class="g" style="flex:1"><b>${esc(G.name)}</b><span class="sub">${G.age}세 · 잠재력 ${grade(G.pot)}</span></div><div class="ovr">${Math.floor(ovrOf(G.stats))}<small>OVR</small></div></button>`+
  phaseBlocks()+lastCard()}
function tableTab(){
  const st=standings(), L=G.last, T=TIERS[G.tier];
  let body='';
  if(!st.length)body='<div class="card"><p class="sub">아직 치른 레이스가 없습니다.</p></div>';
  else if(seg==='race'&&L){
    body=`<div class="gl">${L.gp} 그랑프리${L.wet?' · 우천':''}</div><div class="list">${L.cls.map(e=>`<div class="rw${e.me?' me':''}"><span class="p">${e.dnf?'–':e.pos}</span>${sw(e.color)}<div class="g"><b>${esc(e.name)}</b><span>${esc(e.team)}</span></div><span class="v">${e.dnf?'DNF':e.pts?'+'+e.pts:''}<small>그리드 ${e.grid}</small></span></div>`).join('')}</div>`}
  else{const me=st.findIndex(r=>r.key==='P'); const rows=st.slice(0,10).map((r,i)=>[r,i]); if(me>=10)rows.push([st[me],me]);
    body=`<div class="list">${rows.map(([r,i])=>`<div class="rw${r.key==='P'?' me':''}"><span class="p">${i+1}</span>${sw(r.color)}<div class="g"><b>${esc(r.name)}</b><span>${esc(r.team)}</span></div><span class="v">${r.pts}<small>${r.wins}승</small></span></div>`).join('')}</div>`}
  return head('순위',`${G.year} ${T.name}`)+`<div class="seg"><button class="${seg!=='race'?'on':''}" data-a="seg" data-v="champ">챔피언십</button><button class="${seg==='race'?'on':''}" data-a="seg" data-v="race">지난 레이스</button></div>`+body}
function meTab(){const s=G.stats,T=TIERS[G.tier];
  return head(esc(G.name),`#${G.num||1} · ${G.age}세 · ${esc(G.nat)}`)+
  `<div class="card"><div class="between"><div class="tags"><span class="tag">${T.short}</span><span class="tag">${esc(teamName())}</span>${G.tier===GP?`<span class="tag">${G.role==='race'?'레이스 드라이버':'리저브'}</span><span class="tag">머신 ${carRank(G.team)}위</span>`:''}<span class="tag">잠재력 ${grade(G.pot)}</span></div><div class="ovr xl">${Math.floor(ovrOf(s))}<small>OVR</small></div></div></div>
  <div class="card">${STATS.map(([k,l])=>{const dv=G.deltas[k]||0;return `<div class="stat"><span>${l}</span><div class="bar"><i style="width:${s[k]}%"></i></div><b class="num">${Math.floor(s[k])}</b><span class="d">${dv>=.05?'+'+dv.toFixed(1):''}</span></div>`}).join('')}</div>
  <div class="card"><div class="tiles"><div><b class="purple">${G.tot.titles}</b><span>챔피언</span></div><div><b>${G.tot.wins}</b><span>우승</span></div><div><b>${G.tot.podiums}</b><span>포디움</span></div><div><b>${G.tot.poles}</b><span>폴</span></div></div></div>
  ${G.history.length?`<div class="gl">커리어 기록</div><div class="list">${G.history.slice().reverse().map(h=>`<div class="rw"><div class="g"><b>${h.year} ${h.series}${h.role==='reserve'?' 리저브':''}</b><span>${esc(h.team)}</span></div><span class="v${h.champ?' purple':''}">${h.pos?'P'+h.pos:'–'}<small>${h.pts} PTS · ${h.wins}승</small></span></div>`).join('')}</div>`:''}
  ${confirmNew?`<div class="card"><p>지금 커리어를 지우고 새로 시작할까요?</p><button class="btn" data-a="newno">취소</button><button class="tbtn red" data-a="newyes">지우고 새로 시작</button></div>`:`<button class="tbtn red" data-a="new">새 커리어 시작</button>`}`+FOOT}
const ICON={race:'<path d="M6 21V4"/><path d="M6 5c4-2 6 2 12 0v9c-6 2-8-2-12 0"/>',table:'<path d="M9 7h11M9 12h11M9 17h11"/><path d="M4.5 7h.01M4.5 12h.01M4.5 17h.01"/>',me:'<circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.8 3.6-5.6 7-5.6s6.2 1.8 7 5.6"/>'};
function tabbar(){return `<nav class="tabbar"><div>${[['race','레이스'],['table','순위'],['me','드라이버']].map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${tab===k?'on':''}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg><span>${l}</span></button>`).join('')}</div></nav>`}
function render(){
  if(!G){app.innerHTML=viewCreate();return}
  if(RC){liveShell();return}
  app.innerHTML=(tab==='table'?tableTab():tab==='me'?meTab():raceTab())+tabbar();
}
function newDraft(){draft={step:0,helmet:0,name:'',num:ri(2,99),nat:'대한민국',cands:mkCands(),sel:0,rolls:3,focus:[]}}
function syncDraft(){const n=document.getElementById('in-name'),s=document.getElementById('in-nat'),u=document.getElementById('in-num');if(n)draft.name=n.value;if(s)draft.nat=s.value;if(u)draft.num=clamp(parseInt(u.value)||draft.num,2,99)}
app.addEventListener('input',ev=>{if(G)return;syncDraft();const b=document.getElementById('next-btn');if(b)b.disabled=!draft.name.trim()});
app.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]'); if(!b)return; const a=b.dataset.a,v=b.dataset.v;
  if(a[0]==='l'&&RC&&a!=='lev0'){liveAct(a,v);return}
  if(!G)syncDraft();
  if(a==='tab'){tab=v;confirmNew=false;window.scrollTo(0,0)}
  else if(a==='seg'){seg=v}
  else if(a==='style'){draft.style=v}
  else if(a==='reroll'){if(draft.rolls>0){draft.rolls--;draft.pot=rollPot()}}
  else if(a==='cnext'){if(draft.step===2&&!draft.name.trim())return;draft.step++;window.scrollTo(0,0)}
  else if(a==='cback'){draft.step--}
  else if(a==='helm'){draft.helmet=+v}
  else if(a==='rand'){draft.name=pick(KNAMES);draft.num=ri(2,99);draft.nat=pick(NATIONS)}
  else if(a==='cand'){draft.sel=+v}
  else if(a==='recand'){if(draft.rolls>0){draft.rolls--;draft.cands=mkCands();draft.sel=0;draft.focus=[]}}
  else if(a==='fstat'){const f=draft.focus,i=f.indexOf(v);if(i>=0)f.splice(i,1);else{if(f.length>=2)f.shift();f.push(v)}}
  else if(a==='start'){if(!draft.focus.length)return;startCareer();return}
  else if(a==='focus'){const f=G.focus,i=f.indexOf(v);if(i>=0)f.splice(i,1);else{if(f.length>=2)f.shift();f.push(v)}}
  else if(a==='go'){G.phase='season';G.regNews=false;save()}
  else if(a==='next'){nextRound(false);window.scrollTo(0,0);return}
  else if(a==='quick'){nextRound(true);return}
  else if(a==='auto'){let n=0;while(G.phase==='season'&&n++<40)nextRound(true);return}
  else if(a==='ev'){chooseEvent(+v);return}
  else if(a==='offer'){acceptOffer(+v);return}
  else if(a==='retire'){confirmRetire=true}
  else if(a==='retireno'){confirmRetire=false}
  else if(a==='retireyes'){retire();return}
  else if(a==='new'){confirmNew=true}
  else if(a==='newno'){confirmNew=false}
  else if(a==='newyes'){confirmNew=false;tab='race';G=null;store.del(SAVE);newDraft()}
  render();
});
function start(data){
  G=(data&&data.G)||store.get(SAVE); if(G&&G.v!==2)G=null; if(G&&!Array.isArray(G.focus))G.focus=G.focus?[G.focus]:[]; if(G&&G.phase==='event'){G.phase='season';G.event=null}
  newDraft(); render();
}
window.claude?.hot?.snapshot?.(()=>({G}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
